- id: CLM-RS-SOLANTO
  statement: In one randomised trial of 88 adults with ADHD (Solanto et al., 2010), a 12-week group meta-cognitive
    therapy targeting time management, organisation and planning reduced ADHD symptoms more than supportive
    psychotherapy. This is clinician-delivered group therapy evidence, not evidence that this software
    works.
  sources:
  - SRC-RS-01
  locator: Abstract (Europe PMC record, PMID 20231319)
  supports: Structured, therapist-led skills training in time management and organisation can reduce adult
    ADHD symptoms relative to an attention control.
  does_not_establish: That AI-delivered prompts, self-guided use, or this plugin replicate the effect;
    long-term durability; effects outside group therapy.
  limitations: Single trial; abstract-only reading; therapist delivery.
  tested_ai_implementation: false
  status: partial-access
  accessed: 2026-10-19
  review_trigger: New RCTs or meta-analyses of meta-cognitive therapy; any claim of AI equivalence.
  reviewer_role: clinical reviewer
  legacy_fragment_id: CLM-RS-01
  source_read: abstract-only
  status_note: Wording checked against the abstract only; full text not read.
  link_resolves: true
  clinician_reviewed: false
- id: CLM-RS-SAFREN
  statement: One randomised trial of 86 medication-treated adults with persistent ADHD symptoms (Safren
    et al., 2010) found 12 sessions of CBT reduced symptoms more than relaxation with educational support,
    with gains maintained at 12 months. This concerns therapist-delivered CBT, not this software.
  sources:
  - SRC-RS-02
  locator: Abstract (Europe PMC record, PMID 20736471)
  supports: Individual CBT adds benefit over an attention-matched control for adults already on medication.
  does_not_establish: Benefit for unmedicated adults; effectiveness of digital or AI-delivered CBT-style
    prompts; safety of this plugin.
  limitations: Single trial; abstract-only reading; specialist setting.
  tested_ai_implementation: false
  status: partial-access
  accessed: 2026-10-19
  review_trigger: Replication or updated systematic reviews.
  reviewer_role: clinical reviewer
