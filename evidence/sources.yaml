- id: SRC-BD-11
  title: 'ADHD Body Doubling: What It Is and How It Works'
  authors_or_body: Psych Central; written by Nancy Lovering, medically reviewed by Jeffrey Ditzell, DO
  published: '2022-05-11'
  url: https://www.psychcentral.com/adhd/adhd-body-doubling
  doi: null
