claims:
- id: CLM-BD-DEFINITION
  statement: In a 2024 survey study, neurodivergent community members roughly defined body doubling as
    using the presence of others to start, stay focused on, or accomplish a task; the other person can
    be in the same room or remote, live or recorded, known or a stranger, and need not be doing the same
    task.
  sources:
  - SRC-BD-01
  locator: Abstract; Section 4.1 'What Is Body Doubling?' (pp. 16:12-16:13)
  supports: A community-derived working definition the agent can use when explaining the term.
  does_not_establish: Effectiveness; a clinical or diagnostic definition.
  limitations: Self-selected online sample recruited via social media; English only.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: New peer-reviewed definitional work or consensus statement on body doubling.
  reviewer_role: evidence maintainer (clinical reviewer for health claims)
  legacy_fragment_id: CLM-BD-01
  source_read: full
  link_resolves: true
  clinician_reviewed: false
- id: CLM-BD-SURVEY
  statement: In one self-selected online survey of 220 adults (most identifying as neurodivergent, ADHD
    the most common self-identification, no diagnosis required), 186 said they were somewhat more likely
    or more likely to finish tasks when another person was present, and 108 said more likely. This is
    self-report with no comparison condition.
  sources:
  - SRC-BD-01
  locator: Section 4.3 'Use Cases' and Fig. 7 (p. 16:14); Sections 3.2-3.4 for sample
  supports: Many people who already engage with body-doubling communities perceive it as helpful for task
    completion.
  does_not_establish: That body doubling causally improves task completion; that it helps people with
    clinically diagnosed ADHD; prevalence or effect size in the general ADHD population.
  limitations: Self-selection and recruitment via body-doubling-aware social media; self-report; mostly
    US/EU, mostly female-identifying; 198 vs 193 ND count inconsistency within paper.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: Controlled or longitudinal study measuring task completion with vs without a body double.
  reviewer_role: evidence maintainer (clinical reviewer for health claims)
  legacy_fragment_id: CLM-BD-02
  source_read: full
  link_resolves: true
  clinician_reviewed: false
- id: CLM-BD-VARIATION
  statement: 'Body doubling is not one-size-fits-all: survey respondents reported it varies by person,
    task, mood and availability, and some found another person''s presence more distracting, a source
    of judgement fears or guilt-driven accountability (four respondents), or hard to arrange with a partner
    who was not ''too chatty''; the authors note high-accountability formats can feel stressful or overwhelming.'
  sources:
  - SRC-BD-01
  locator: Section 4.4.3 (p. 16:17); Section 4.5.1 (pp. 16:17-16:18); Section 5 Discussion (p. 16:19)
  supports: Offering body doubling as optional, low-pressure and adjustable, and checking in on whether
    it is helping.
  does_not_establish: Frequency of harms; that any format is harmful.
  limitations: Qualitative counts from open responses; not systematically elicited negatives.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: Studies reporting adverse experiences or dependence with body doubling or AI companions.
  reviewer_role: evidence maintainer (clinical reviewer for health claims)
  legacy_fragment_id: CLM-BD-03
  source_read: full
  link_resolves: true
  clinician_reviewed: false
- id: CLM-BD-MODEL
  statement: 'Eagle et al. propose (as a descriptive model, not a tested one) that body doubling varies
    along two continua: space/time (from live and co-located to pre-recorded and elsewhere) and mutuality
    (from an aware partner you are accountable to, to ambient companionship from people unaware of their
    role).'
  sources:
  - SRC-BD-01
  locator: Section 5.3 'Mapping Body Doubling' and Fig. 9 (pp. 16:21-16:22)
  supports: Design framing for offering presence options of differing liveness and accountability.
  does_not_establish: That any region of the model is more effective.
  limitations: Authors' interpretive model derived from survey themes.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: Empirical tests of model dimensions (e.g. Tan et al. roadmap follow-up).
  reviewer_role: evidence maintainer (clinical reviewer for health claims)
  legacy_fragment_id: CLM-BD-04
  source_read: full
  link_resolves: true
  clinician_reviewed: false
- id: CLM-BD-EEG
  statement: A small 2025 ASSETS study (N=26; neurotypical, medicated ADHD and unmedicated ADHD participants)
    found no statistically significant differences between body-doubling and solo conditions on ACT reading
    comprehension or EEG-derived focus and calmness metrics; the authors report no consistent negative
    impacts and 'promising trends' for unmedicated ADHD participants.
  sources:
  - SRC-BD-02
  - SRC-BD-03
  locator: SRC-BD-02 abstract (via OpenAlex); SRC-BD-03 poster abstract
  supports: Stating that controlled lab evidence so far does not show a measurable performance benefit
    on a reading test.
  does_not_establish: That body doubling does not work (underpowered null); effects on task initiation
    or completion; what the body double was instructed to do.
  limitations: Abstract only; full text inaccessible; small sample split across three groups; single reading
    task; consumer EEG metrics. The 'quiet, neutral double' instruction described in the source report
    could not be verified (full text inaccessible).
  tested_ai_implementation: false
  status: partial-access
  accessed: 2026-10-19
  review_trigger: Full text becomes accessible; replication with task-initiation outcomes.
  reviewer_role: evidence maintainer (clinical reviewer for health claims)
  legacy_fragment_id: CLM-BD-05
  source_read: abstract-only
  link_resolves: true
  clinician_reviewed: false
- id: CLM-BD-VR
  statement: In a non-peer-reviewed VR preprint (12 ASRS-screened adults, 20-minute bricklaying task),
    working with a human avatar or an 'AI' avatar both produced more bricks per minute (10.82 and 11.06)
    than working alone (8.49), with no difference between the two; the 'AI' double was secretly operated
    by a human (Wizard-of-Oz), so this does not test an autonomous AI.
  sources:
  - SRC-BD-04
  locator: Section 5.2 (Wizard-of-Oz); Section 6.1.1-6.1.2 (sample, ASRS); Section 6.2.1 (efficiency);
    Section 7.2 (limitations)
  supports: Perceived-AI presence can be studied as a body double in VR; short-term efficiency gains in
    one task.
  does_not_establish: Effects of a real autonomous AI; long-term or real-world benefit; effects in clinically
    diagnosed ADHD; accuracy gains (behavioural accuracy and object detection were not significant).
  limitations: n=12; one session per condition; construction-inspired task; operator was an author; participants
    deceived about AI; preprint.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: Peer-reviewed version published or a study with an autonomous AI body double.
  reviewer_role: evidence maintainer (clinical reviewer for health claims)
  legacy_fragment_id: CLM-BD-06
  source_read: partial
  link_resolves: true
  clinician_reviewed: false
- id: CLM-BD-ROBOT
  statement: In a three-week in-dorm study of 11 college students with self-reported ADHD symptoms, 10
    of 11 chose to keep using a small companion robot when use was voluntary, and usability was rated
    high (mean SUS 83.86); the robot only made pre-programmed idle motions at random times and did not
    respond to the student, and no objective task-performance outcome was measured.
  sources:
  - SRC-BD-06
  locator: Abstract; Section 3.3 (robot behaviour); Section 3.4 (design, participants); Section 4.1 (10
    of 11, SUS); Section 5.1 (limitations)
  supports: Acceptability and voluntary uptake of a non-human ambient presence in a small sample.
  does_not_establish: Efficacy for schoolwork or ADHD symptoms (ESQ-R, NASA-TLX showed no significant
    change); effects of an AI or attention-monitoring system.
  limitations: n=11; self-reported symptoms; no no-motion control; recording may have changed behaviour;
    possible demand effects.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: Follow-up with responsive/autonomous robot or AI and outcome measures.
  reviewer_role: evidence maintainer (clinical reviewer for health claims)
  legacy_fragment_id: CLM-BD-07
  source_read: full
  link_resolves: true
  clinician_reviewed: false
- id: CLM-BD-SOCIALFAC
  statement: 'In general (non-ADHD) research, a 1983 meta-analysis of 241 studies with nearly 24,000 participants
    found the mere presence of others had small effects: it sped up simple tasks and slowed complex ones,
    impaired accuracy on complex tasks and only slightly improved accuracy on simple tasks (a finding
    vulnerable to unpublished null results).'
  sources:
  - SRC-BD-07
  locator: Abstract
  supports: Background that social presence can help or hinder depending on task complexity; caution about
    using presence for complex tasks.
  does_not_establish: Anything specific to ADHD, body doubling or AI presence; effects on task initiation.
  limitations: Abstract only; 1983 literature; effects account for roughly 0.3%-3% of variance.
  tested_ai_implementation: false
  status: partial-access
  accessed: 2026-10-19
  review_trigger: Access to full text, or a newer social facilitation meta-analysis.
  reviewer_role: evidence maintainer (clinical reviewer for health claims)
  legacy_fragment_id: CLM-BD-08
  source_read: abstract-only
  link_resolves: true
  clinician_reviewed: false
- id: CLM-BD-MECHANISM
  statement: No source reviewed here tested or established a neurochemical (for example dopamine) mechanism
    for body doubling. The research papers either do not mention dopamine or list other untested theories
    (mirror neurons, Hawthorne effect, social facilitation, accountability); consumer pages that mention
    dopamine or neurotransmitters present it as speculation, an inference from general social-behaviour
    research, or a claim attributed to a commercial service.
  sources:
  - SRC-BD-01
  - SRC-BD-05
  - SRC-BD-09
  - SRC-BD-10
  - SRC-BD-11
  - SRC-BD-12
  locator: SRC-BD-01 Section 2 (theories); SRC-BD-05 full text (no dopamine); SRC-BD-10 (Focusmate attribution);
    SRC-BD-11 (dopamine inference from Kopec et al. 2019 review)
  supports: The agent should not say body doubling 'boosts dopamine' or works through any established
    brain mechanism; it may say why it works is not known.
  does_not_establish: That no such mechanism exists, or that no study anywhere has tested one - the search
    was targeted, not systematic.
  limitations: Absence-of-evidence claim based on the sources listed and web searches on 2026-10-19; no
    PubMed systematic search performed.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: Any study measuring neurochemical or neural correlates of body doubling; systematic
    search by clinical reviewer.
  reviewer_role: evidence maintainer (clinical reviewer for health claims)
  legacy_fragment_id: CLM-BD-09
  source_read: full
  link_resolves: true
  clinician_reviewed: false
- id: CLM-BD-EARLY
  statement: 'Research on body doubling is limited and early: a 2026 work-in-progress roadmap describes
    it as ''a fairly new and under-researched topic'', and ADHD organisations ADDA and CHADD both state
    that research proving its effectiveness is lacking.'
  sources:
  - SRC-BD-05
  - SRC-BD-09
  - SRC-BD-10
  locator: SRC-BD-05 Introduction/Conclusion; SRC-BD-09 body text; SRC-BD-10 body text
  supports: Framing body doubling to users as a commonly reported strategy worth trying, not an evidence-based
    treatment.
  does_not_establish: That it is ineffective.
  limitations: Statements of evidence gaps by roadmap authors and advocacy organisations, not a systematic
    review.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: Publication of a systematic review or RCT on body doubling.
  reviewer_role: evidence maintainer (clinical reviewer for health claims)
  legacy_fragment_id: CLM-BD-10
  source_read: full
  link_resolves: true
  clinician_reviewed: false
- id: CLM-BD-NO-AI
  statement: 'None of the studies reviewed here evaluated an autonomous AI body double: the VR ''AI''
    was human-operated (Wizard-of-Oz), the robot used random pre-programmed motions, and the roadmap reports
    no new data.'
  sources:
  - SRC-BD-04
  - SRC-BD-05
  - SRC-BD-06
  locator: SRC-BD-04 Section 5.2; SRC-BD-06 Section 3.3; SRC-BD-05 full text
  supports: Any AI body-doubling feature in the plugin is untested by this evidence and should be described
    as an experiment, not a validated intervention.
  does_not_establish: That AI body doubling is ineffective or harmful.
  limitations: Scoped to sources in this fragment; other AI body-doubling studies may exist.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: Any study of an autonomous AI/LLM body double with outcome measures.
  reviewer_role: evidence maintainer (clinical reviewer for health claims)
  legacy_fragment_id: CLM-BD-11
  source_read: full
  link_resolves: true
  clinician_reviewed: false
- id: CLM-BD-PRACTICE
  statement: ADDA runs regular 90-minute Zoom body-doubling sessions where cameras and talking are optional;
    this shows the practice is offered by an ADHD organisation, not that it is proven effective.
  sources:
  - SRC-BD-08
  locator: add.org/body-doubling/ session list
  supports: Signposting a human, community body-doubling option.
  does_not_establish: Effectiveness; that sessions are open to non-members; current schedule beyond access
    date.
  limitations: Programme page; benefit claims on page are uncited; schedule may change.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: Page change or schedule change; re-check every 6 months.
  reviewer_role: evidence maintainer (clinical reviewer for health claims)
  legacy_fragment_id: CLM-BD-12
  source_read: full
  link_resolves: true
  clinician_reviewed: false
- id: CLM-GD-NHS-DIAGNOSIS
  statement: In the UK, ADHD should only be diagnosed by a specialist (e.g. psychiatrist or other appropriately
    qualified healthcare professional) after a full clinical and psychosocial assessment; a GP may refer
    to an ADHD specialist.
  sources:
  - SRC-GD-02
  - SRC-GD-01
  locator: NICE NG87 rec 1.3.1 [2008]; NHS 'Getting help with ADHD' and 'What happens at an ADHD assessment'
  supports: Runtime must not diagnose or imply diagnosis; signpost to GP/specialist assessment.
  does_not_establish: Assessment pathways, waiting times or eligibility outside England/UK; anything about
    the accuracy of any specific screening tool.
  limitations: UK/England jurisdiction; rec dates from 2008.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: NICE NG87 update or surveillance decision; NHS page review date 19 March 2028
  reviewer_role: clinical reviewer
  legacy_fragment_id: CLM-GD-01
  source_read: full
  link_resolves: true
  clinician_reviewed: false
- id: CLM-GD-NHS-ONLINE-TEST
  statement: NHS adult ADHD information does not itself state that online tests cannot diagnose ADHD;
    it links to an ADHD UK self-screening tool.
  sources:
  - SRC-GD-01
  locator: NHS 'Getting help with ADHD' (external link list)
  supports: Do not attribute an 'online tests cannot diagnose' statement to the NHS page; the diagnostic
    boundary should be sourced from NICE 1.3.1 instead.
  does_not_establish: That online tests are or are not valid; any claim about the ADHD UK tool.
  limitations: Absence-of-statement finding on one page; other NHS pages not checked.
  tested_ai_implementation: false
  status: unverified
  accessed: 2026-10-19
  review_trigger: NHS page review (19 March 2028) or wording change
  reviewer_role: clinical reviewer
  legacy_fragment_id: CLM-GD-02
  source_read: full
  link_resolves: true
  clinician_reviewed: false
- id: CLM-GD-NICE-ENV
  statement: NICE describes environmental modifications as changes to the environment, tailored to an
    assessment of the person's needs, such as changes to seating, lighting and noise, reducing distractions
    (e.g. headphones), shorter periods of focus with movement breaks, and reinforcing verbal requests
    with written instructions.
  sources:
  - SRC-GD-02
  locator: 'NICE NG87 Recommendations, ''Terms used in this guideline: Environmental modifications'';
    referenced in recs 1.4.3, 1.4.12, 1.5.13, 1.5.15'
  supports: Offering general, user-chosen environment and task-structure ideas (distraction reduction,
    short focus blocks with breaks, written steps) as information, not as treatment.
  does_not_establish: Effectiveness of any specific modification or of AI-delivered suggestions; that
    these replace clinical care (rec 1.5.15 positions them before medication review in adults, within
    a clinical pathway).
  limitations: Definition, not a standalone numbered rec; England jurisdiction; clinical-pathway context.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: NICE NG87 update
  reviewer_role: clinical reviewer
  legacy_fragment_id: CLM-GD-03
  source_read: full
  link_resolves: true
  clinician_reviewed: false
- id: CLM-GD-NICE-SDM
  statement: NICE recommends a holistic shared treatment plan and regularly discussing with people with
    ADHD how they want to be involved in treatment decisions, including benefits and harms of non-drug
    and drug treatments and their preferences.
  sources:
  - SRC-GD-02
  locator: NICE NG87 recs 1.5.2, 1.5.3, 1.5.4 [2018]
  supports: Runtime framing that treatment choices are made by the person with their clinician; the tool
    supports preparing questions, not deciding.
  does_not_establish: Any role for AI in shared decision-making.
  limitations: Clinician-facing; England jurisdiction.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: NICE NG87 update
  reviewer_role: clinical reviewer
  legacy_fragment_id: CLM-GD-04
  source_read: full
  link_resolves: true
  clinician_reviewed: false
- id: CLM-GD-MED-ROUTE
  statement: In the UK, ADHD medicines are started and monitored by an ADHD specialist; questions about
    how to take a medicine or remember doses can go to a pharmacist, and stopping should be discussed
    with the doctor first.
  sources:
  - SRC-GD-01
  - SRC-GD-02
  - SRC-GD-04
  locator: NHS ADHD adults 'Medicines'; NICE NG87 rec 1.7.2; NHS methylphenidate 'How and when to take'
    (stopping, help remembering)
  supports: Routing all medicine questions (dose, timing, stopping, switching) to prescriber or pharmacist;
    no dosing advice from the tool.
  does_not_establish: Prescribing arrangements outside the UK; advice for any specific medicine other
    than as stated.
  limitations: UK; shared care arrangements vary.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: NHS page review dates (March 2028); NICE update
  reviewer_role: clinical reviewer
  legacy_fragment_id: CLM-GD-05
  source_read: full
  link_resolves: true
  clinician_reviewed: false
- id: CLM-GD-MPH-MISSED
  statement: For methylphenidate (adults), NHS advice for a forgotten dose is to skip it and take the
    next dose at the usual time, and not to take 2 doses to make up for it; an alarm or a pharmacist can
    help with remembering.
  sources:
  - SRC-GD-04
  locator: NHS methylphenidate for adults, 'How and when to take' > 'If you forget to take it'
  supports: Quoting/linking the NHS page only when a user asks specifically about missed methylphenidate
    doses, with prompt to confirm with prescriber/pharmacist.
  does_not_establish: Missed-dose advice for any other ADHD medicine, formulation-specific or individual
    instructions, or non-UK advice.
  limitations: Bounded to methylphenidate, adults, NHS; individual prescriber instructions take precedence.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: NHS page review due 25 March 2028
  reviewer_role: clinical reviewer
  legacy_fragment_id: CLM-GD-06
  source_read: full
  link_resolves: true
  clinician_reviewed: false
- id: CLM-GD-MPH-OVERDOSE
  statement: NHS advises getting medical advice after taking more methylphenidate than prescribed even
    without symptoms (111 online/phone), and calling 999 or going to A&E for a fit/seizure or fast, slow
    or irregular heartbeat.
  sources:
  - SRC-GD-04
  locator: NHS methylphenidate for adults, 'How and when to take' > 'If you take too much'
  supports: Immediate signposting to 111/999 (UK) on any mention of excess dose; no reassurance or assessment
    by the tool.
  does_not_establish: Overdose thresholds; routing outside the UK.
  limitations: UK numbers only; methylphenidate only.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: NHS page review due 25 March 2028
  reviewer_role: clinical reviewer
  legacy_fragment_id: CLM-GD-07
  source_read: full
  link_resolves: true
  clinician_reviewed: false
- id: CLM-GD-MPH-URGENT
  statement: For methylphenidate (adults), NHS lists serious side effects to report to a GP or 111 straight
    away (e.g. mood changes, palpitations, hallucinations, new facial tics) and ones needing 999 or A&E
    (e.g. chest pain, stroke symptoms, fits, thoughts of harming yourself or others; anaphylaxis -> 999).
  sources:
  - SRC-GD-05
  locator: NHS 'Side effects of methylphenidate for adults' > 'Serious side effects' and 'Serious allergic
    reaction'
  supports: 'Escalation routing: the tool stops and signposts urgent care when a user reports such symptoms.'
  does_not_establish: Side-effect frequencies beyond 'uncommon (<1 in 100)'; triage by the tool; non-UK
    routing.
  limitations: Methylphenidate only; UK services.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: NHS page review due 25 March 2028
  reviewer_role: clinical reviewer
  legacy_fragment_id: CLM-GD-08
  source_read: full
  link_resolves: true
  clinician_reviewed: false
- id: CLM-GD-NHS-MANAGE
  statement: NHS lists ways to manage adult ADHD including lifestyle changes, work/study adjustments,
    medicines and talking therapies such as CBT or mindfulness.
  sources:
  - SRC-GD-01
  locator: NHS ADHD in adults 'How to manage ADHD'
  supports: General description of the range of support options, with signposting to clinicians.
  does_not_establish: Which option suits any individual; effectiveness of self-help delivered by an AI
    tool.
  limitations: UK patient information.
  tested_ai_implementation: false
