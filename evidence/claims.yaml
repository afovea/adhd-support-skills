- id: CLM-GD-CADDRA-SCAFFOLD
  statement: CADDRA's guideline lists practical external supports such as structure and routines, visual
    reminders, timers/apps for deadlines, chunking larger tasks into smaller steps with deadlines, and
    planned movement breaks during prolonged tasks.
  sources:
  - SRC-GD-06
  locator: CADDRA 4.1 Edition, Chapter 4, Table 4.2 Home Interventions (printed pp. 46-47)
  supports: Offering timers, reminders, routines, chunking and break prompts as general practical strategies.
  does_not_establish: Effectiveness of these strategies when delivered by AI; that they are treatment.
  limitations: Canada; 4.1 Edition (2020) with update announced July 2026 but not released; strategies
    are practice-based lists.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: Release of updated CADDRA Practice Guidelines (announced July 2026)
  reviewer_role: clinical reviewer
