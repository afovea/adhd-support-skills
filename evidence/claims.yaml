  locator: WHO news release 28 June 2021 (six guiding principles); publication page 9789240029200
  supports: Design rule that the user decides; the tool suggests, never decides, and seeks informed consent
    for data use.
  does_not_establish: Binding legal obligations; specific implementation requirements (full report not
