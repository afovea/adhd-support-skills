  clinician_reviewed: false
- id: CLM-GD-ICO-SPECIAL
  statement: Under UK GDPR, data concerning health (including mental health) is special category data,
    and inferences about health can be special category data where processing aims to infer it or treats
    people differently on that basis.
  sources:
  - SRC-GD-09
  locator: ICO 'What is special category data?' > health data; inferences
  supports: Treating user disclosures about ADHD, symptoms or medication, and any inferred health status,
    as special category data requiring an Article 9 condition and minimisation.
  does_not_establish: Final post-Data (Use and Access) Act 2025 position; lawful basis for this product.
  limitations: UK; page states guidance is under review due to the Data (Use and Access) Act.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: ICO publishes revised guidance after Data (Use and Access) Act review
  reviewer_role: privacy/legal reviewer
  legacy_fragment_id: CLM-GD-13
