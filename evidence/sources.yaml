- id: SRC-BD-10
  title: Could a Body Double Help You Increase Your Productivity?
  authors_or_body: CHADD, ADHD Weekly (no byline)
  published: ADHD Weekly editions dated 21 Apr 2022, 19 Feb 2025, 17 Apr 2025
  url: https://chadd.org/adhd-weekly/could-a-body-double-help-you-increase-your-productivity/
  doi: null
  category: practice-community
  design: Newsletter article
  population: null
  sample_size: null
  link_resolves: true
  source_read: full
  tested_ai_implementation: false
  notes: 'States ''there hasn''t been significant research to validate the benefits or the dynamics of
    how it works''. Attributes ''activating certain neurotransmitters through behavior'' to Focusmate
    (a commercial service), not to research. Cautions: doesn''t work for everyone; friends may socialise
    instead; check-ins take time. Other CHADD pages (''The Power of Body Doubling'', ''Sometimes It Takes
    Two'') exist but bodies were not readable.'
