sources:
- id: SRC-BD-01
  title: '"It Was Something I Naturally Found Worked and Heard About Later": An Investigation of Body
    Doubling with Neurodivergent Participants'
  authors_or_body: Tessa Eagle, Leya Breanna Baltaxe-Admony, Kathryn E. Ringland (University of California,
    Santa Cruz)
  published: ACM Transactions on Accessible Computing, Vol. 17, No. 3, Article 16, October 2024 (received
    17 Nov 2023; revised 30 May 2024; accepted 6 Aug 2024)
  url: https://leyabreanna.com/papers/body_double_taccess.pdf
  doi: 10.1145/3689648
  category: observational-qualitative
  design: Online cross-sectional survey (descriptive statistics plus thematic coding of open responses);
    distributed October 2022 via Twitter, neurodivergent/productivity subreddits and TikTok; no compensation;
    IRB approved
  population: Self-selected adults (18-72, mean 34.2, median 31.5; 55.9% female-identifying); 193 (87.7%)
    identified as neurodivergent; no diagnosis required; ADHD most common self-identified identity (139),
    autism 82; 30 countries, mostly North America (123) and Europe (58); English-language survey only
  sample_size: 220 complete responses (from 410 submissions; 187 partial and 3 under-18 removed)
  link_resolves: true
  source_read: full
  tested_ai_implementation: false
  notes: 'Author PDF fetched and text extracted locally (glyph-offset decoding, readable). doi.org redirects
    to dl.acm.org, which returned HTTP 403 to the fetcher. Internal inconsistency: Section 3.2 says 198/220
    identified as ND, Section 3.4 says 193 (87.7%). Paper does not mention dopamine; it lists mirror neurons,
    Hawthorne effect, social facilitation and echopraxia as theories others have proposed (Section 2),
    without testing them.'
  jurisdiction: null
  accessed: '2026-10-19'
  clinician_reviewed: false
- id: SRC-BD-02
  title: 'Reading Between the Lines: Exploring Body Doubling in ADHD Using EEG'
  authors_or_body: Ryan Schuenke, Sidney R Dickenson, Meredith Moore (Drake University)
  published: ASSETS '25 (27th International ACM SIGACCESS Conference), Denver; online 22 Oct 2025; pp.
    1-6
  url: https://doi.org/10.1145/3663547.3759743
  doi: 10.1145/3663547.3759743
  category: peer-reviewed-research
  design: 'Within-subjects comparison: two ACT reading comprehension assessments, one with a body double
    and one alone, with consumer EEG/BCI focus and calmness metrics (per abstract)'
  population: Neurotypical controls and individuals with ADHD, medicated and unmedicated (per abstract);
    group sizes not seen
  sample_size: N=26 (per abstract)
  link_resolves: true
  source_read: abstract-only
  tested_ai_implementation: false
  notes: Full text blocked (ACM DL HTTP 403 to fetcher and curl). Abstract read via OpenAlex record; title/authors
    confirmed on ASSETS 2025 poster session C page (https://assets25.sigaccess.org/poster_session_c.html),
    which shows no abstract. ASSETS posters are typically extended abstracts; review depth not confirmed.
    Body-double instructions (e.g. quiet/neutral) NOT seen.
  jurisdiction: null
  accessed: '2026-10-19'
  clinician_reviewed: false
- id: SRC-BD-03
  title: Evaluating the Efficacy of Body Doubling for ADHD Using a Brain-Computer Interface
  authors_or_body: Ryan Schuenke, Meredith Moore (Drake University)
  published: CCSC Central Plains 2025 poster contest (no date shown on page)
  url: https://www.ccsc.org/centralplains/2025/talks/talk-poster16/
  doi: null
  category: preprint-or-prototype
  design: 'Poster abstract: unmedicated ADHD, medicated ADHD and neurotypical groups took an ACT Reading
    Comprehension exam alone and with a body double while wearing a Neurosity Crown BCI'
  population: Unmedicated ADHD, medicated ADHD, neurotypical
  sample_size: null
  link_resolves: true
  source_read: abstract-only
  tested_ai_implementation: false
  notes: Related student-poster abstract by overlapping authors; appears to be the same or an earlier
    version of the SRC-BD-02 study, but this is not stated on either page. Reports body doubling 'does
    not have a significant effect on performance, focus, or calm'.
  jurisdiction: null
  accessed: '2026-10-19'
  clinician_reviewed: false
- id: SRC-BD-04
  title: 'You Are Not Alone: Designing Body Doubling for ADHD in Virtual Reality'
  authors_or_body: Zinat Ara, Imtiaz Bin Rahim, Puqi Zhou, Liuchuan Yu, Behzad Esmaeili, Lap-Fai Yu, Sungsoo
    Ray Hong
  published: arXiv:2509.12153v1 [cs.HC], 15 Sep 2025
  url: https://arxiv.org/html/2509.12153v1
  doi: null
  category: preprint-or-prototype
  design: 'Formative interviews (n=5) then within-subjects VR experiment, three counterbalanced 20-minute
    conditions: alone, human double (avatar), ''AI'' double (Wizard-of-Oz, human-operated); post-session
    surveys and interviews'
  population: Adults aged 18-31 (5 female, 7 male), mostly university students/staff, screened with ASRS
    v1.1; a formal diagnosis is not stated as an eligibility requirement
  sample_size: 12 (summative study)
  link_resolves: true
  source_read: partial
  tested_ai_implementation: false
  notes: 'Characters 0-100,000 of 122,232 read (main text incl. methods, results, limitations); remainder
    unread. Not peer reviewed (placeholder DOI). The ''AI'' avatar was secretly controlled by a human
    operator (one of the authors) while participants were told it was AI-driven (Section 5.2). Task: VR
    bricklaying copy task with moving-object detection. Task-continuity statistics appear identical to
    sustained-attention statistics (possible reporting error).'
  jurisdiction: null
  accessed: '2026-10-19'
  clinician_reviewed: false
- id: SRC-BD-05
  title: A Roadmap of Mixed Reality Body Doubling for Adults with ADHD
  authors_or_body: Valerie Tan, Kimberly Hegemann, Jens Gerken (TU Dortmund University)
  published: 'arXiv:2605.07851v1 [cs.HC], 8 May 2026; listed for a CHI ''26 workshop (Co-Living: Reality-Virtuality)'
  url: https://arxiv.org/html/2605.07851v1
  doi: null
  category: preprint-or-prototype
  design: Short work-in-progress conceptual framework/roadmap built from literature, community sources
    and author discussion; no new empirical data
  population: Adults with ADHD (target population; no participants)
  sample_size: null
  link_resolves: true
  source_read: full
  tested_ai_implementation: false
  notes: Abstract says 'twelve dimensions'; Section 3.2.4 says '10 distinct dimensions'; about 11 are
    named. Does not mention dopamine. States body doubling is 'a fairly new and under-researched topic'.
  jurisdiction: null
  accessed: '2026-10-19'
  clinician_reviewed: false
- id: SRC-BD-06
  title: Design and Evaluation of a Socially Assistive Robot Schoolwork Companion for College Students
    with ADHD
  authors_or_body: Amy O'Connell, Ashveen Banga, Jennifer Ayissi, Nikki Yaminrafie, Ellen Ko, Andrew Le,
    Bailey Cislowski, Maja Mataric (University of Southern California)
  published: HRI '24, Boulder, CO, 11 Mar 2024, pp. 533-541; arXiv:2401.06289v1, 11 Jan 2024
  url: https://arxiv.org/html/2401.06289v1
  doi: 10.1145/3610977.3634929
  category: peer-reviewed-research
  design: 'Three-week within-subjects in-dorm field study: week without robot (computer-based system),
    week with required robot use (50 min/day x 5 days), week with voluntary robot use (condition C); SUS,
    ESQ-R, NASA-TLX, NARS, interviews'
  population: University students (18-25; 6 female, 5 male) with self-reported adult ADHD symptoms (ASRS
    screener score >= 4); no clinical diagnosis required; recruited via mailing lists; $135 gift cards
  sample_size: 12 recruited, 11 completed
  link_resolves: true
  source_read: full
  tested_ai_implementation: false
  notes: Read the arXiv version; ACM DL version not accessed (403). Robot 'Blossom' executed hard-coded
    idle motions at random intervals and 'the participant's actions did not influence Blossom's behavior'
    (Section 3.3) - framed as a body double/ambient companion, not an autonomous AI or attention-monitoring
    system. No objective task-performance outcome measured.
  jurisdiction: null
  accessed: '2026-10-19'
  clinician_reviewed: false
- id: SRC-BD-07
  title: 'Social facilitation: A meta-analysis of 241 studies'
  authors_or_body: Charles F. Bond, Linda J. Titus
  published: Psychological Bulletin, 94(2), 265-292, 1983
  url: https://doi.org/10.1037/0033-2909.94.2.265
  doi: 10.1037/0033-2909.94.2.265
  category: adjacent-cognitive-hci
  design: Meta-analysis of mere-presence effects on task performance and physiology
  population: General (non-ADHD) human participants across 241 studies
  sample_size: 241 studies, 'nearly 24,000 subjects'
  link_resolves: true
  source_read: abstract-only
  tested_ai_implementation: false
  notes: DOI resolves to APA PsycNet (JS-only, unreadable to fetcher); PubMed lists 'No abstract available'.
    Abstract read via OpenAlex (OCR text). Not about ADHD or body doubling.
  jurisdiction: null
  accessed: '2026-10-19'
  clinician_reviewed: false
