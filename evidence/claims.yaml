- id: CLM-RS-ROUTINE-SCOPING
  statement: A 2026 scoping review of 31 studies (Almudayfir et al., Behavioral Sciences) found that research
    on daily routines and habits in ADHD is concentrated in paediatric populations, with limited adult
    research and no validated ADHD-specific routine/habit measure. Routine-support features for adults
    therefore rest on thin direct evidence.
  sources:
  - SRC-RS-10
  locator: Abstract (PMID 42352833)
  supports: Stating that adult routine/habit evidence is a gap.
  does_not_establish: That routine features help or harm adults with ADHD; any efficacy of this software.
  limitations: Scoping review (no effect estimates); abstract only; only 6 intervention studies.
  tested_ai_implementation: false
  status: partial-access
  accessed: 2026-10-19
  review_trigger: New adult routine/habit intervention studies.
  reviewer_role: clinical reviewer
