- id: CLM-RS-LIVED
  statement: A 2022 rapid review of 35 qualitative studies (Ginapp et al.) reported that adults with ADHD
    describe using regular schedules, to-do lists and reminder apps, and being helped by partners, friends,
    family and workplace reminders. These are self-reported coping strategies, not evidence that they
    work or that this software helps.
  sources:
  - SRC-RS-18
  locator: Results, 'Adapting to symptoms' (Coping skills; Outside support)
  supports: Framing features around strategies adults with ADHD already report using.
  does_not_establish: Efficacy of any strategy; generalisability (mostly male, English-language, Europe/North
    America/Asia samples).
  limitations: Rapid review; single-reviewer appraisal; variable diagnosis verification.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
