  design: Consumer health article (interviews and anecdote)
  population: null
  sample_size: null
  link_resolves: true
  source_read: full
  tested_ai_implementation: false
  notes: Says body doubling 'may help people with ADHD by increasing their dopamine levels' - an inference
    from a 2019 review on dopamine and social behaviour generally (Kopec et al.), not a body-doubling
    study; also a personal-interview quote. Also says 'there's not a lot of research on ADHD and body
    doubling' (expert quote). Example of an unsupported dopamine framing.
  jurisdiction: null
