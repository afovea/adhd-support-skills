- id: CLM-RS-IMPL-INTENTIONS
  statement: In general-population research, forming if-then plans (implementation intentions) had a medium-to-large
    average effect on goal attainment across 94 tests (Gollwitzer & Sheeran, 2006, d = .65). This is adjacent
    evidence for cue-action pairing. It is not ADHD-specific and not evidence for this software.
  sources:
  - SRC-RS-19
  locator: Abstract (Semantic Scholar record)
  supports: Theoretical basis for offering if-then cue-action prompts.
  does_not_establish: Effect in ADHD; effect when an AI suggests the plan; durability.
  limitations: Older (2006) meta-analysis; abstract only; publication bias and heterogeneity not checked
    in this register.
  tested_ai_implementation: false
