- id: CLM-RS-CBT-FUNCTION
  statement: A 2026 meta-analysis of 70 studies with 5,152 participants (López-Pinar et al., Behaviour
    Research and Therapy) found CBT for adult ADHD was associated with moderate gains in global functioning
    (SMD 0.47 post-treatment, 0.67 at follow-up), with the strongest effects for occupational functioning.
    Many included studies were uncontrolled, and this is not evidence for this software.
  sources:
  - SRC-RS-04
  locator: Abstract (PMID 41936228)
  supports: CBT may improve everyday functioning, particularly at work, beyond symptom change.
  does_not_establish: Causal effects from the uncontrolled studies; effects of AI or digital self-help;
    durable benefits beyond short follow-up (~3 months typical).
  limitations: Mixed designs (only 38 of 70 RCTs); self-report heavy; mostly Western samples; risk of
    bias flagged by authors.
  tested_ai_implementation: false
  status: partial-access
  accessed: 2026-10-19
