- id: CLM-RS-TIME-PERCEPTION
  statement: 'A 2023 review of a decade of adult ADHD time-perception research (Mette) found few studies
    and mixed results for time estimation and reproduction: some studies show deficits and others no clear
    difference. Time-blindness should not be presented as an established universal deficit.'
  sources:
  - SRC-RS-12
  locator: Abstract (PMID 36833791)
  supports: Hedged wording about time perception in adults with ADHD.
  does_not_establish: That time-perception support features help; the size of any deficit.
  limitations: Narrative review; small evidence base; heterogeneous methods; abstract only.
  tested_ai_implementation: false
