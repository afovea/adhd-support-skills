- id: CLM-RS-PM-ADHD
  statement: In a 2026 experiment with 196 adults (98 with ADHD), Stelz, Edel and Altgassen found lower
    everyday prospective memory in the ADHD group, and found that episodic future thinking (vividly imagining
    carrying out an intention) at encoding improved performance compared with standard encoding. This
    is lab-assigned encoding instruction over three sessions, not evidence for this software.
  sources:
  - SRC-RS-06
  - SRC-RS-07
  locator: SRC-RS-06 abstract (PMID 42475007); SRC-RS-07 abstract (PMID 41684048)
  supports: Prompting people to imagine future intention execution is a candidate technique for remembering
    intentions, including in adults with ADHD.
  does_not_establish: Effect sizes (not in abstract); durability; effects when prompted by an AI tool;
    that a 'process' focus is better (outcome focus did best).
  limitations: Single experiment; abstract only. A separate 2026 study (n=127, SRC-RS-07) found its EFT
    benefit was not significant after controlling for verbal ability, so the evidence is not uniform.
    A second 2026 study with a similar design (Altgassen et al., n=127) found the episodic-future-thinking
    benefit was not significant after controlling for verbal ability; findings are mixed.
  tested_ai_implementation: false
  status: partial-access
  accessed: 2026-10-19
  review_trigger: Full-text effect sizes; replications.
  reviewer_role: clinical reviewer
  legacy_fragment_id: CLM-RS-06
  source_read: abstract-only
  status_note: Wording checked against the abstract only; full text not read.
  link_resolves: true
