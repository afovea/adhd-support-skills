- id: CLM-RS-CBT-COMPONENTS
  statement: A component network meta-analysis of 43 trials and 3,817 participants (Matsumoto et al.,
    2024, BMJ Mental Health) found that CBT packages including organisational strategies were associated
    with higher treatment response, and problem-solving components with reduced inattention. These are
    associations from trial-level modelling of therapist-delivered CBT, possibly including adolescents,
    not evidence for this software.
  sources:
  - SRC-RS-05
  locator: Abstract (PMID 39732478)
  supports: Organisational-strategy content is a plausible active ingredient in CBT for ADHD.
  does_not_establish: Causation at the component level; adult-only effects; that organisational prompts
    from an AI assistant are effective.
  limitations: Component effects are model-based associations; the problem-solving CI lower bound is 0.01;
    searches end March 2022; age mix of trials not confirmed. Protocol eligibility spanned ages 10-60;
    do not describe as adult-only. Authors are Matsumoto et al., not as named in the source report.
  tested_ai_implementation: false
  status: partial-access
  accessed: 2026-10-19
  review_trigger: Confirm age eligibility from full text; updated component NMAs.
  reviewer_role: clinical reviewer
