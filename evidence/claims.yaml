- id: CLM-RS-EMOTION-DYSREG
  statement: A 2020 meta-analysis (Beheshti et al., BMC Psychiatry; 13 studies, N = 2,535) found emotion
    dysregulation was markedly elevated on average in adults with ADHD compared with controls (g = 1.17),
    and correlated with ADHD symptom severity (r = 0.54). This is a group average, not a diagnosis of
    any user, and not evidence for this software.
  sources:
  - SRC-RS-13
  locator: Abstract (PMID 32164655)
  supports: Acknowledging that emotional difficulties are common in adult ADHD and designing for them.
  does_not_establish: That any emotion-support feature is effective or safe; causality between symptoms
    and dysregulation.
  limitations: 13 studies; self-report measures; moderators untestable; cross-sectional correlations.
  tested_ai_implementation: false
  status: partial-access
  accessed: 2026-10-19
  review_trigger: Updated meta-analyses.
