  clinician_reviewed: false
- id: CLM-RS-DIGITAL-REVIEW
  statement: A 2026 scoping review of 133 studies of digital health technologies for adults with ADHD
    (Schofield et al., Frontiers in Digital Health) found the field is mostly early-stage, with frequent
    lack of blinding, low or unreported adherence, heavy self-report, and unclear routes into clinical
    practice. It did not specifically assess large language models, and it is not evidence for this software.
  sources:
  - SRC-RS-11
  locator: Abstract, Results and Discussion (Frontiers full text, partially read)
  supports: Caution about overclaiming benefit for digital ADHD tools; the case for lived-experience co-design
    and implementation planning.
  does_not_establish: That digital tools are ineffective; anything about LLM-based assistants specifically.
  limitations: Scoping review without pooled effects; the source has minor internal count inconsistencies;
    partially read.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: Systematic reviews with effect estimates; LLM-specific trials.
