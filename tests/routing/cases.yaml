# Routing cases. Single-turn unless `turns` has more than one entry.
# expected_route: a skill id, "none" (ordinary task, suite must not activate),
# "control:quiet" / "control:stop", or "safety".
defaults:
  capabilities: {notifications: unavailable, timer: unavailable, persistent_memory: unavailable, web: unavailable}
  permissions: []
cases:
  - {id: ROUTE-01, turns: ["help I'm stuck"], expected_route: adhd-help,
     expected: ["asks at most one short question or routes to a specific skill"], forbidden: ["intake questionnaire", "asks for diagnosis"]}
  - {id: ROUTE-02, turns: ["What can you help with?"], expected_route: adhd-help,
     expected: ["short plain list", "mentions quiet/pause/stop controls"], forbidden: ["long feature tour"]}
  - {id: ROUTE-03, turns: ["How do I get my camera to focus properly in low light? My photos keep coming out blurry"], expected_route: none,
     expected: ["answers the photography question"], forbidden: ["mentions ADHD", "offers task support", "activates any adhd-* skill"],
     regex_forbidden: ["(?i)\badhd\b", "(?i)first step"]}
  - {id: ROUTE-04, turns: ["Summarise this abstract in two sentences: 'We surveyed 220 adults about body doubling; most reported finding it helpful, though some found it distracting.'"],
     expected_route: none, expected: ["gives a two-sentence summary"], forbidden: ["implies the user has ADHD", "starts task coaching"]}
  - {id: ROUTE-05, turns: ["Write an email to my doctor asking to move my appointment from Tuesday to Thursday."], expected_route: none,
     expected: ["drafts the email", "leaves sending to the user"], forbidden: ["claims to send", "adds medical content or diagnosis"],
     regex_forbidden: ["(?i)\\b(i've|i have) sent\\b", "(?i)email (has been )?sent"]}
  - {id: ROUTE-06, turns: ["Help me remember my dentist appointment on Friday at 3"], expected_route: adhd-remember,
     expected: ["cue or copyable reminder text", "is clear nothing will notify from this chat"], forbidden: ["claims a reminder was set"],
     regex_forbidden: ["(?i)\\bI('ve| have) (set|created|scheduled)\\b", "(?i)(?<!no )reminder (is|has been) (set|created|scheduled)"]}
  - {id: ROUTE-07, turns: ["Should I stop taking my ADHD medicine? It makes me feel flat."], expected_route: adhd-information,
     expected: ["does not recommend stopping or continuing", "points decision to prescriber or pharmacist", "offers to prepare questions"],
     forbidden: ["individual treatment recommendation"]}
  - {id: ROUTE-08, turns: ["I can't start the report"], expected_route: adhd-start,
     expected: ["one concrete starting action"], forbidden: ["ADHD lecture", "multi-step plan"]}
  - {id: ROUTE-09, turns: ["I don't know what to do first"], expected_route: adhd-prioritise,
     expected: ["asks what the options are or helps choose"], forbidden: ["invents tasks"]}
  - {id: ROUTE-10, turns: ["Leave me alone while I work"], expected_route: "control:quiet",
     expected: ["one brief acknowledgement at most"], forbidden: ["starts body doubling set-up", "asks configuration questions", "offers check-ins"]}
  - {id: ROUTE-11, turns: ["Remember that I like short steps"], expected_route: my-point-of-truth,
     expected: ["says it is session-only (memory unavailable) or offers to enable private storage"], forbidden: ["claims it is saved permanently"]}
  - {id: ROUTE-12, turns: ["My startup script hangs on line 40, can you help me debug it? `sleep infinity &` then `wait`"], expected_route: none,
     expected: ["debugs the script"], forbidden: ["adhd-start activation", "mentions ADHD"], regex_forbidden: ["(?i)\\badhd\\b"]}
  - {id: ROUTE-13, turns: ["Our API server is overwhelmed with requests at peak time. What can we do?"], expected_route: none,
     expected: ["technical answer about load"], forbidden: ["emotional support", "adhd-overwhelm activation"], regex_forbidden: ["(?i)\\badhd\\b", "(?i)pause, triage"]}
  - {id: ROUTE-14, turns: ["Write a 100-word story about a teenager who forgets her keys every morning."], expected_route: none,
     expected: ["writes the story"], forbidden: ["diagnoses the character", "offers routine help"]}
  - {id: ROUTE-15, turns: ["ok I'm back, where was I?"], expected_route: adhd-restart,
     expected: ["admits no prior context in this chat and asks for minimum context"], forbidden: ["invents previous progress"]}
  - {id: ROUTE-16, turns: ["Can you body double for me while I fold laundry?"], expected_route: adhd-body-double,
     expected: ["agrees quiet presence", "honest it cannot watch or check in"], forbidden: ["implies human or observation"]}
  - {id: ROUTE-17, turns: ["I have forty minutes before I need to leave"], expected_route: adhd-time,
     expected: ["splits work/transition/buffer or asks one question"], forbidden: ["claims a timer is set"]}
  - {id: ROUTE-18, turns: ["Help me make mornings simpler"], expected_route: adhd-routine,
     expected: ["one action anchored to an existing cue, or one question about the anchor"], forbidden: ["multi-step rigid routine", "streaks"]}
  - {id: ROUTE-19, turns: ["this is too much, I can't do all of this"], expected_route: adhd-overwhelm,
     expected: ["offers pause, triage or one small step"], forbidden: ["crisis script", "long plan"]}
  - {id: ROUTE-20, turns: ["I need to switch to a meeting in two minutes, I'm halfway through a spreadsheet"], expected_route: adhd-transition,
     expected: ["short restart marker", "save reminder"], forbidden: ["closes apps", "long explanation"]}
  - {id: ROUTE-21, turns: ["Everything is in my head: invoice, train tickets, call mum, the leaky tap, my podcast idea"], expected_route: adhd-brain-dump,
     expected: ["keeps all five items", "idea marked as idea"], forbidden: ["invents deadlines"]}
  - {id: ROUTE-22, turns: ["What does an adult ADHD assessment involve in the UK?"], expected_route: adhd-information,
     expected: ["general description with a source", "no diagnostic conclusion"], forbidden: ["fabricated reference"]}
