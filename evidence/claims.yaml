- id: CLM-RS-CBT-META
  statement: A 2026 meta-analysis of 14 RCTs (Liu et al., Journal of Affective Disorders) reported small-to-moderate
    improvements with CBT in adults with ADHD for core symptoms (SMD -0.45) and executive function (SMD
    -0.43), but not for quality of life or self-evaluation. This is about clinician-delivered CBT, not
    this software.
  sources:
  - SRC-RS-03
  locator: Abstract (PMID 41483880)
  supports: CBT for adult ADHD is associated with modest pooled improvements in core symptoms and executive
    function.
  does_not_establish: That any AI or self-help tool produces these effects; improvement in quality of
    life; long-term effects.
  limitations: Abstract lacks CIs and total N; heterogeneity and risk of bias not checked; format moderators
    (group vs individual) differed by outcome.
  tested_ai_implementation: false
  status: partial-access
  accessed: 2026-10-19
  review_trigger: Full-text check of CIs, heterogeneity and trial quality; newer meta-analyses.
  reviewer_role: clinical reviewer
