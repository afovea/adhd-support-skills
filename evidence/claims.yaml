- id: CLM-RS-DELAY
  statement: Meta-analyses find that, on average, people with ADHD choose smaller immediate rewards over
    larger delayed ones more than controls (Jackson & MacKillop 2016, d = 0.43; Marx et al. 2021, small-to-medium
    effects). This is a group-average laboratory finding, not a statement about any individual and not
    evidence for this software.
  sources:
  - SRC-RS-08
  - SRC-RS-09
  locator: Abstracts (PMID 27722208; PMID 29806533)
  supports: Designs that reduce delay or add near-term feedback are theoretically motivated for ADHD.
  does_not_establish: That any particular reward or nudge design improves outcomes; individual-level prediction;
    adult-only effects (mixed-age samples).
  limitations: Mixed ages; publication bias noted by Jackson & MacKillop; paradigm-dependent effects.
  tested_ai_implementation: false
  status: partial-access
  accessed: 2026-10-19
  review_trigger: Newer adult-specific meta-analyses.
  reviewer_role: clinical reviewer
