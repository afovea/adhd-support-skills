  link_resolves: true
  clinician_reviewed: false
- id: CLM-GD-MHRA-SAMD
  statement: MHRA guidance states a digital mental health technology is regulated as software as a medical
    device if it is intended to have a medical purpose and its functionality is considered complex; intended
    purpose is set by the manufacturer.
  sources:
  - SRC-GD-08
  locator: GOV.UK DMHT qualification and classification landing page (summary); full PDF not read
  supports: Keeping the plugin's stated intended purpose non-medical (general information, organisation
    support) and avoiding diagnostic/treatment claims to stay outside SaMD scope.
  does_not_establish: That the plugin is or is not a medical device; classification details from the 54-page
    PDF.
  limitations: UK (GB) regulation; PDF not read; landing page updated 29 July 2026.
  tested_ai_implementation: false
  status: verified
  accessed: 2026-10-19
  review_trigger: GOV.UK page update; MHRA software/AI regulation changes
  reviewer_role: privacy/legal reviewer
