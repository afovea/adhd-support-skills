- id: CLM-RS-INTERRUPTION
  statement: Interruption research in general (non-ADHD) participants suggests that a brief warning before
    an interruption, which gives time to prepare, is associated with faster resumption (Trafton et al.,
    2003). Memory-for-goals theory (Altmann & Trafton, 2002) holds that suspended goals decay and are
    retrieved through cues. This is adjacent cognitive evidence. It has not been tested in ADHD or with
    this software.
  sources:
  - SRC-RS-14
  - SRC-RS-15
  locator: SRC-RS-14 abstract snippets via web search only; SRC-RS-15 abstract (OpenAlex/PhilPapers)
  supports: Theoretical rationale for 'leave yourself a note on where you were' resumption cues.
  does_not_establish: Effects in ADHD; effect sizes; that an AI-prompted resumption note reduces resumption
    cost.
  limitations: Trafton 2003 abstract and methods not fully read; sample unconfirmed; manipulation was
    warning/interruption lag, not explicit intention encoding; lab tasks.
  tested_ai_implementation: false
  status: partial-access
  accessed: 2026-10-19
  review_trigger: Obtain Trafton 2003 full text; look for ADHD-specific interruption studies.
  reviewer_role: clinical reviewer
  legacy_fragment_id: CLM-RS-12
  source_read: partial
  link_resolves: true
  clinician_reviewed: false
- id: CLM-RS-DIGITAL-RCTS
  statement: 'Two RCTs of self-guided or unguided digital programmes for adults with ADHD reported benefits:
    Kenter et al. (2023; n=120) for symptoms and quality of life vs online psychoeducation, and Baumeister
    et al. (2026; n=307) for quality of life when an unguided app was added to usual care, with low adherence.
    These were structured programmes, not this AI software.'
  sources:
  - SRC-RS-16
  - SRC-RS-17
  locator: Abstracts (PMID 36969389; PMID 42240305)
  supports: Digital self-help can plausibly benefit some adults with ADHD.
  does_not_establish: Efficacy of LLM/AI assistants; symptom effects in the 2026 trial (primary outcome
    QoL); long-term effects.
  limitations: 'Kenter: self-reported ADHD per protocol, small n. Baumeister: open-label, exploratory
    10% alpha, no standardised diagnostics, low adherence. Baumeister et al. primary outcome was quality
    of life (not symptoms); open-label, exploratory alpha, low adherence.'
  tested_ai_implementation: false
  status: partial-access
  accessed: 2026-10-19
  review_trigger: Full-text checks; replication; any AI-assistant RCT.
  reviewer_role: clinical reviewer
