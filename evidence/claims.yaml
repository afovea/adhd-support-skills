- id: CLM-GD-MPH-COMMON
  statement: For methylphenidate in adults, the NHS lists common side effects (more than 1 in 100 people)
    as headaches, trouble sleeping, loss of appetite (with possible weight loss in the first few months),
    stomach ache, dry mouth and feeling or being sick, and advises telling a doctor if they bother you
    or don't go away.
  sources:
  - SRC-GD-05
  locator: NHS 'Side effects of methylphenidate for adults' > 'Common side effects of methylphenidate'
  supports: General UK patient-information list of common side effects for this one medicine.
  does_not_establish: Individual risk, other ADHD medicines, other formulations or other countries' labelling.
  limitations: UK, adults, methylphenidate only. Read via a fetch summary on the access date; re-check
    before quoting the advice wording.
  tested_ai_implementation: false
