- id: CLM-GD-AADPA-CBT
  statement: The Australian guideline text indicates cognitive-behavioural interventions should be offered
    to adults with ADHD as an option to consider, ideally ADHD-specific and strengths-based.
  sources:
  - SRC-GD-03
  locator: AADPA guideline 4.2.2 Cognitive-behavioural interventions, evidence-to-recommendation text
    (adults)
  supports: Mentioning that structured psychological therapy is a recognised option to discuss with a
    clinician.
  does_not_establish: Formal recommendation number/grade (not captured); that AI coaching is CBT or equivalent.
  limitations: Australia; recommendation block not extracted; no page date.
